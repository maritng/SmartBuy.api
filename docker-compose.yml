# Entorno local completo de SmartBuy: base + API (con los bots adentro) + front.
# Uso: docker compose up -d --build
#
# Con la API siempre encendida, el orquestador captura las 7 cadenas una vez
# por día, solo. La app queda en http://localhost:4300 y la API en
# http://localhost:5100 (el flujo de desarrollo con VS en el 5080 no se toca).
services:
  db:
    image: postgres:17
    container_name: smartbuy-db
    # Se levanta solo con Docker Desktop tras un reinicio de la máquina
    # (salvo que lo hayas parado a mano con docker compose stop/down).
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart123
      POSTGRES_DB: SmartBuy
    ports:
      - "5432:5432"
    volumes:
      - smartbuy-pgdata:/var/lib/postgresql/data
      # Los .sql/.sh de esta carpeta se ejecutan solo la primera vez que se crea el volumen:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d SmartBuy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: SmartBuy.Api/Dockerfile
    container_name: smartbuy-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Dentro de la red de compose, la base no es localhost: es el servicio db.
      Orion__Providers__PostgresSmartBuy__ConnectionString: "Host=db;Port=5432;Database=SmartBuy;Username=smart;Password=smart123;"
    ports:
      - "5100:8080"

  front:
    build:
      context: ../SmartBuy.UI
    container_name: smartbuy-front
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4300:80"

volumes:
  smartbuy-pgdata:
